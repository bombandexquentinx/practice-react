name: CD Demo

on:
  push:
    branches: [ dev ]

env:
  PLESK_GIT_WEBHOOK_URL: ${{ secrets.PLESK_DEMO_GIT_WEBHOOK_URL }}

jobs:
  deploy_demo:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build --if-present
      - name: Trigger Plesk auto-deploy (Demo)
        run: curl -X POST "$PLESK_GIT_WEBHOOK_URL" -H "X-Git-Event: push"